architectury {
	common rootProject.enabled_platforms.split(',')
}

dependencies {
	modImplementation "net.fabricmc:fabric-loader:$rootProject.fabric_loader_version"

	// EMI provides the item/recipe stack and the host UI. We only ever use its API.
	modImplementation "dev.emi:emi-fabric:$rootProject.emi_version"
	// Cloth Config's API is loader-agnostic; the platform modules supply the implementation.
	modImplementation "me.shedaniel.cloth:cloth-config-fabric:$rootProject.cloth_config_version"

	testImplementation platform('org.junit:junit-bom:5.10.2')
	testImplementation 'org.junit.jupiter:junit-jupiter'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
	useJUnitPlatform()
}
