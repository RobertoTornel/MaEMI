plugins {
	id 'dev.architectury.loom' version '1.7-SNAPSHOT' apply false
	id 'architectury-plugin' version '3.4-SNAPSHOT'
	id 'com.gradleup.shadow' version '8.3.6' apply false
}

architectury {
	minecraft = project.minecraft_version
}

allprojects {
	group = rootProject.maven_group
	version = rootProject.mod_version

	repositories {
		maven { name = 'Fabric'; url = 'https://maven.fabricmc.net/' }
		maven { name = 'Architectury'; url = 'https://maven.architectury.dev/' }
		maven { name = 'Shedaniel'; url = 'https://maven.shedaniel.me/' }
		maven { name = 'TerraformersMC'; url = 'https://maven.terraformersmc.com/releases/' }
		maven { name = 'Sleeping Town'; url = 'https://repo.sleeping.town/' }
		maven { name = 'Modrinth'; url = 'https://api.modrinth.com/maven' }
		mavenCentral()
	}
}

subprojects {
	apply plugin: 'dev.architectury.loom'
	apply plugin: 'architectury-plugin'
	apply plugin: 'maven-publish'

	base {
		archivesName = "$rootProject.archives_name-$project.name"
	}

	dependencies {
		minecraft "net.minecraft:minecraft:$rootProject.minecraft_version"
		mappings "net.fabricmc:yarn:$rootProject.yarn_mappings:v2"
	}

	java {
		withSourcesJar()
		sourceCompatibility = JavaVersion.VERSION_21
		targetCompatibility = JavaVersion.VERSION_21
	}

	tasks.withType(JavaCompile).configureEach {
		it.options.release = 21
		it.options.encoding = 'UTF-8'
	}

	processResources {
		inputs.property 'version', project.version
	}
}